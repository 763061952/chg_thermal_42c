# 机型配置：Redmi K90 Pro Max（K90PM）
# 匹配：ro.product.device = myron / ro.product.model = 25102RKBEC
# 系统：Android 17 / OS4.0.0.33.XPMCNXM（内核 6.12.69）
#
# 实机实测（2026-10-07，原装充电器 + 亮屏 + 电量 20-33%）：
#   - 官方策略：平稳时 wired_ctrl_limit=0、wired_chg_curr≈18.4A，功率 46~55W
#   - 温度爬升到 ~36℃ 后官方开始写 limit=11/12/14（降档），功率掉到 7~22W
#   - 写 wired_thermal_remove=1 后，官方仍会写 limit（11/12/14），
#     但功率不再掉档，稳定 40~47W；即 remove=1 已足以解除温控降档
#   - remove=1 时 wired_ctrl_limit 被驱动架空（写 0~100 均可，不影响功率），
#     因此本机型不写档位（WRITE_GEAR=0），只写 remove，避免与官方策略无效竞争
#   - 温度上升较快：remove=1 全程 3.5 分钟从 34.9℃ 升至 42.5℃，因此必须启用温度保护
DEVICE_ID="myron"
DEVICE_MODEL="25102RKBEC"
DEVICE_LABEL="Redmi K90 Pro Max"
SUPPORTED=1

# 档位：实测 remove=1 时 limit 被架空，保持官方自己的值即可
OPEN_GEAR=""
STOCK_GEAR=""
WRITE_GEAR=0

# 温度保护（单位 0.1℃）：到达 43.0℃ 交回官方降温，降回 42.0℃ 重新放开
# 实测循环（原装头 + 亮屏 + 46W）：放开段 78s（41.0→43.1℃）、降温段 47s（43.1→42.4℃），
# 周期约 2 分钟、快充占空比约 60%
T_HARD=430
T_RESUME=420
